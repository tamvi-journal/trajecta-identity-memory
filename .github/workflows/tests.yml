name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Test
        run: python -W error::ResourceWarning -m pytest -q
      - name: CLI smoke test
        shell: bash
        env:
          TRAJECTA_IDENTITY_DATA_DIR: ${{ runner.temp }}/tim
        run: |
          trajecta-identity --profile example init
          trajecta-identity --profile example retrieve "who are you" --packet
      - name: Build wheel
        run: python -m pip wheel . --no-deps -w dist
