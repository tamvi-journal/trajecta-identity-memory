name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (kernel from the pinned commit)
        run: python -m pip install ".[test]"
      - name: Test
        run: python -W error::ResourceWarning -m pytest -q
      - name: CLI smoke test
        shell: bash
        env:
          TRAJECTA_IDENTITY_DATA_DIR: ${{ runner.temp }}/tim
          TRAJECTA_IDENTITY_PROFILES: ${{ github.workspace }}/profiles
        run: |
          trajecta-identity --profile aux init
          trajecta-identity --profile aux retrieve "anh là ai" --packet
