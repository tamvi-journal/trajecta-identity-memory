[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trajecta-identity-memory"
version = "0.1.0"
description = "Self-authored identity memory for agents, built on agent-memory-core."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    # Pinned by commit: kernel changes only reach this product when the pin moves.
    "agent-memory-core @ git+https://github.com/tamvi-journal/agent-memory-core@feeaa59ab0b33ffea4c23e56cd333cafb5ccba39",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
trajecta-identity = "trajecta_identity.cli:main"
trajecta-identity-mcp = "trajecta_identity.mcp_server:main"

[tool.setuptools]
packages = ["trajecta_identity"]

[tool.pytest.ini_options]
testpaths = ["tests"]
